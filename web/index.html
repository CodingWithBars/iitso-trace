<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Web Optimization and PWA tags -->
  <meta name="theme-color" content="#121212">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>trace</title>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.deferredPwaPrompt = null;
    window.isPwaInstalled = false;

    window.checkIsPwaInstalled = function() {
      const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                          window.navigator.standalone === true ||
                          document.referrer.includes('android-app://');
      return isStandalone || window.isPwaInstalled;
    };

    window.hasDeferredPwaPrompt = function() {
      return window.deferredPwaPrompt !== null;
    };

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      if (window.onPwaInstallable) {
        window.onPwaInstallable();
      }
    });

    window.addEventListener('appinstalled', function() {
      window.deferredPwaPrompt = null;
      window.isPwaInstalled = true;
      if (window.onPwaInstalled) {
        window.onPwaInstalled();
      }
    });

    window.triggerPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        try {
          window.deferredPwaPrompt.prompt();
          const choiceResult = await window.deferredPwaPrompt.userChoice;
          if (choiceResult.outcome === 'accepted') {
            window.deferredPwaPrompt = null;
            window.isPwaInstalled = true;
            return true;
          }
        } catch (err) {
          console.log('PWA prompt error:', err);
        }
      }
      return false;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
