<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TRACE — Transparent Records & Attendance for Campus Events">

  <!-- Mobile & PWA Optimization Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRACE">
  <meta name="theme-color" content="#050505">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRACE — Campus Attendance & Student Records</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Full-Screen Launch Splash ──────────────────────────────────── */
    #trace-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Radial glow from bottom center — matches the screenshot exactly */
      background: radial-gradient(
        ellipse 100% 80% at 50% 100%,
        #C44000 0%,
        #6B1E00 30%,
        #2A0800 60%,
        #050505 100%
      );
      opacity: 1;
      visibility: visible;
      transition:
        opacity   0.55s cubic-bezier(0.4, 0, 0.2, 1),
        visibility 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      /* Respect iOS notch / home indicator */
      padding-top:    env(safe-area-inset-top,    0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left:   env(safe-area-inset-left,   0px);
      padding-right:  env(safe-area-inset-right,  0px);
    }

    #trace-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #trace-splash .splash-gif {
      width:  clamp(140px, 42vmin, 200px);
      height: clamp(140px, 42vmin, 200px);
      object-fit: contain;
      border-radius: 24px;
      box-shadow:
        0 0 50px  rgba(255, 87, 34, 0.55),
        0 0 100px rgba(255, 87, 34, 0.25);
      animation: tracePulse 2.2s ease-in-out infinite;
    }

    @keyframes tracePulse {
      0%, 100% {
        box-shadow: 0 0 50px rgba(255,87,34,0.55), 0 0 100px rgba(255,87,34,0.25);
      }
      50% {
        box-shadow: 0 0 70px rgba(255,87,34,0.80), 0 0 140px rgba(255,87,34,0.40);
      }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Splash (replaces Vercel/browser default loading screen) -->
  <div id="trace-splash">
    <img src="assets/assets/splash-logo.gif"
         class="splash-gif"
         alt="TRACE"
         draggable="false"
         decoding="async" />
  </div>

  <script>
    // ── PWA State ──────────────────────────────────────────────────────
    window.deferredPwaPrompt = null;
    window.isPwaInstalled    = false;

    // ── Platform Detection (called from Dart via JS interop) ───────────
    window.isIOSDevice = function() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };

    window.isAndroidDevice = function() {
      return /android/i.test(navigator.userAgent);
    };

    window.checkIsPwaInstalled = function() {
      var isStandalone =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        (window.navigator.standalone === true) ||
        document.referrer.includes('android-app://');
      return isStandalone || window.isPwaInstalled;
    };

    window.hasDeferredPwaPrompt = function() {
      return window.deferredPwaPrompt !== null;
    };

    // ── PWA Install Prompt ─────────────────────────────────────────────
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      if (typeof window.onPwaInstallable === 'function') window.onPwaInstallable();
    });

    window.addEventListener('appinstalled', function() {
      window.deferredPwaPrompt = null;
      window.isPwaInstalled    = true;
      if (typeof window.onPwaInstalled === 'function') window.onPwaInstalled();
    });

    window.triggerPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        try {
          window.deferredPwaPrompt.prompt();
          var result = await window.deferredPwaPrompt.userChoice;
          if (result.outcome === 'accepted') {
            window.deferredPwaPrompt = null;
            window.isPwaInstalled    = true;
            return true;
          }
        } catch (e) {
          console.warn('[TRACE PWA]', e);
        }
      }
      return false;
    };

    // ── Splash Dismissal ───────────────────────────────────────────────
    var _splashDone = false;
    function dismissSplash() {
      if (_splashDone) return;
      _splashDone = true;
      var el = document.getElementById('trace-splash');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function() { el && el.parentNode && el.parentNode.removeChild(el); }, 700);
    }

    // 1) Flutter's official first-frame event
    window.addEventListener('flutter-first-frame', dismissSplash);

    // 2) DOM mutation — catches canvas/glass-pane insertion
    var _obs = new MutationObserver(function() {
      if (document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view')   ||
          document.querySelector('canvas')) {
        dismissSplash();
        _obs.disconnect();
      }
    });
    _obs.observe(document.body, { childList: true, subtree: true });

    // 3) Hard safety timeout (8 s)
    setTimeout(dismissSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
